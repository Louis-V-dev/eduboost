# Build and deploy Vite/React frontend to Azure Web App - eduboost-fe
# Docs: https://github.com/Azure/webapps-deploy

name: Build and deploy frontend to Azure Web App - eduboost-fe

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: eduBoostFrontend/package-lock.json

      - name: Install dependencies
        working-directory: ./eduBoostFrontend
        run: npm ci

      - name: Build frontend
        working-directory: ./eduBoostFrontend
        run: rm -rf dist && npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}

      # Package static build + minimal Node server so Azure runs our app instead of placeholder
      - name: Package for wwwroot
        run: |
          mkdir -p deploy
          cp -r eduBoostFrontend/dist/. deploy/
          cat > deploy/package.json << 'PKG'
          {"name":"eduboost-fe","version":"1.0.0","description":"Static SPA","scripts":{"start":"node server.js"},"engines":{"node":">=18"}}
          PKG
          cat > deploy/server.js << 'SRV'
          const http = require('http');
          const fs = require('fs');
          const path = require('path');
          const url = require('url');
          const port = process.env.PORT || 8080;
          const mime = { '.html':'text/html','.js':'application/javascript','.json':'application/json','.css':'text/css','.ico':'image/x-icon','.svg':'image/svg+xml','.png':'image/png','.jpg':'image/jpeg','.woff2':'font/woff2' };
          const server = http.createServer((req, res) => {
            let p = (url.parse(req.url).pathname || '/').replace(/^\//, '') || 'index.html';
            p = path.join(__dirname, p);
            fs.readFile(p, (err, data) => {
              if (err) {
                if (err.code === 'ENOENT') { fs.readFile(path.join(__dirname, 'index.html'), (e, d) => { res.writeHead(200, { 'Content-Type': 'text/html' }); res.end(d || ''); }); return; }
                res.writeHead(500); res.end();
                return;
              }
              const ext = path.extname(p);
              res.writeHead(200, { 'Content-Type': mime[ext] || 'application/octet-stream' });
              res.end(data);
            });
          });
          server.listen(port, () => console.log('Server on port', port));
          SRV
          ls -la deploy

      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: deploy

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist

      # Ensure index.html is at workspace root for package (artifact may extract as "deploy/" or flat)
      - name: Prepare deploy root
        run: |
          if [ -d deploy ] && [ ! -f index.html ]; then
            shopt -s dotglob 2>/dev/null || true
            mv deploy/* . 2>/dev/null || true
            mv deploy/.* . 2>/dev/null || true
            rm -rf deploy
          elif [ -d eduBoostFrontend/dist ]; then
            shopt -s dotglob 2>/dev/null || true
            mv eduBoostFrontend/dist/* .
            mv eduBoostFrontend/dist/.* . 2>/dev/null || true
            rm -rf eduBoostFrontend
          elif [ -d dist ] && [ ! -f index.html ]; then
            shopt -s dotglob 2>/dev/null || true
            mv dist/* .
            mv dist/.* . 2>/dev/null || true
            rm -rf dist
          fi
          echo "Contents to deploy:"
          ls -la
          ls -la assets 2>/dev/null || true

      # Zip contents (no extra root folder) so wwwroot gets index.html at root
      - name: Create deployment zip
        run: zip -r deploy.zip . -x "*.git*"

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_F93FA3F5BFB24566AA84D0FEDDAF26D8 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_4B955F1D7FB642B58D58A04A5352C87C }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_AC3DFD2C940A4FC9AC1D8EDE35A4CCBE }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'eduboost-fe'
          slot-name: 'Production'
          package: deploy.zip
          clean: true
