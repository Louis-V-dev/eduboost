# Build and deploy Vite/React frontend to Azure Web App - eduboost-fe
# Docs: https://github.com/Azure/webapps-deploy

name: Build and deploy frontend to Azure Web App - eduboost-fe

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: eduBoostFrontend/package-lock.json

      - name: Install dependencies
        working-directory: ./eduBoostFrontend
        run: npm ci

      - name: Build frontend
        working-directory: ./eduBoostFrontend
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}

      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: eduBoostFrontend/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_F93FA3F5BFB24566AA84D0FEDDAF26D8 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_4B955F1D7FB642B58D58A04A5352C87C }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_AC3DFD2C940A4FC9AC1D8EDE35A4CCBE }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'eduboost-fe'
          slot-name: 'Production'
          package: .
